name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-canary:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          $slHome = Join-Path $env:RUNNER_TEMP "self-learn-home"
          $xdgCache = Join-Path $env:RUNNER_TEMP "xdg-cache"
          New-Item -ItemType Directory -Force -Path $slHome, $xdgCache | Out-Null
          "SELF_LEARN_HOME=$slHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_CACHE_HOME=$xdgCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The home-floor steps load the package-root conftest in isolation.
      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: Native capture integration
        working-directory: plugins/self-learn/cli
        run: |
          $env:WIN_PD_OVERRIDE_LOCAL_APPDATA = Join-Path $env:RUNNER_TEMP "capture-local"
          $env:WIN_PD_OVERRIDE_APPDATA = Join-Path $env:RUNNER_TEMP "capture-roaming"
          $expected = @(
            'test_cross_drive_pointer_and_git_rejection'
            'test_foreign_registry_is_readable_and_preserved'
            'test_registration_reads_registry_under_shared_lock'
            'test_flagged_spool_refuses_unverified_quarantine'
            'test_capability_table_matches_parser'
            'test_refusal_profile_precedes_dispatch'
            'test_background_kicks_refuse_before_settings'
            'test_two_powershell_processes_share_committed_capture[default]'
            'test_two_powershell_processes_share_committed_capture[utf8]'
            'test_worktrees_and_modes_share_commit_lock'
            'test_recovery_after_killed_writer'
            'test_concurrent_flush_and_append'
            'test_git_excludes_trailing_space'
            'test_readonly_and_creating_cache_have_same_path'
            'test_component_rejects_invalid_actor_without_creating_spool'
            'test_static_junction_escape_refused'
            'test_git_tree_keys_and_literal_pathspec_with_unrelated_index_entry'
            'test_existing_buckets_roundtrip_without_rekey'
            'test_init_repairs_local_config_before_recovery'
          )
          foreach ($version in '3.12', '3.13') {
            if ($version -eq '3.13') {
              $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "capture-env-313"
              uv sync --locked --python $version
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            $report = Join-Path $env:RUNNER_TEMP "capture-$version.xml"
            uv run --python $version --no-sync python -m pytest tests/test_windows_capture.py tests/test_platform_integration.py -p no:cacheprovider -o xfail_strict=true -q -rA --junitxml=$report
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
            $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") } | ForEach-Object { $_.name })
            $skipped = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
            if ((Compare-Object -CaseSensitive $expected $ran) -or $skipped.Count -ne 1 -or $skipped[0].name -cne 'test_linux_teach_never_imports_capabilities' -or $skipped[0].skipped.message -cne 'Linux capture contract') {
              throw "Unexpected capture selection or skip: $ran"
            }
          }

      - name: Windows observer hook tests
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "observer-hook-contracts.xml"
          uv run --no-sync python -m pytest tests/test_hook_entry.py -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object {
            $_.name -cmatch '^test_(windows_console_hook|hook_closed_descriptors)\[' -and !$_.SelectSingleNode("skipped")
          })
          $posix = @($cases | Where-Object {
            ($_.name -cmatch '^test_bash_differential\[' -and $_.skipped.message -ceq "Bash differential runs on POSIX") -or
              ($_.name -cmatch '^test_linux_child_deadline_survives_hook_death\[' -and $_.skipped.message -ceq "Linux parent-death watchdog")
          })
          if ($ran.Count -ne 68 -or $posix.Count -ne 76 -or $cases.Count -ne 144) {
            throw "Expected 68 native hook cases and 76 POSIX-only skips. Executed $($ran.Count) native cases. Found $($posix.Count) POSIX-only skips and $($cases.Count) total cases."
          }

      - name: Windows names and folders contracts
        working-directory: plugins/self-learn/cli
        run: |
          $env:WIN_PD_OVERRIDE_LOCAL_APPDATA = Join-Path $env:RUNNER_TEMP "names-local"
          $env:WIN_PD_OVERRIDE_APPDATA = Join-Path $env:RUNNER_TEMP "names-roaming"
          $report = Join-Path $env:RUNNER_TEMP "names-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_names.py -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { $_.name -like "test_windows_*" -and !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "historical POSIX storage contract"
          })
          if ($ran.Count -ne 17 -or $unexpected.Count) { throw "Unexpected native names test count or skip" }

      - name: Windows file-lock contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "lock-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_locks.py -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { $_.name -like "test_windows_*" -and !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "POSIX lock semantics or product integration"
          })
          if (!$ran.Count) { throw "No native Windows lock test ran" }
          if ($unexpected.Count) { throw "Unexpectedly skipped lock tests: $($unexpected.name -join ', ')" }

      - name: Windows file publishing contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "fsops-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_fsops.py -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $unexpected = @($skips | Where-Object { $_.skipped.message -cne "Linux filesystem contract" })
          if ($ran.Count -ne 28 -or $skips.Count -ne 7 -or $unexpected.Count -ne 0) {
            throw "Expected 28 executed fsops cases and 7 Linux-only skips. Executed $($ran.Count), skipped $($skips.Count), unexpected $($unexpected.Count)."
          }

      - name: Windows process contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "process-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_procs.py tests/test_bounded_children.py::test_native_launch_has_one_owner_and_rejects_a_second -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "Linux process contract"
          })
          $expected = @(
            'test_platform_procs::test_argument_stdin_encoding_exit_matrix'
            'test_platform_procs::test_batch_shim_refusal_names_target[.bat]'
            'test_platform_procs::test_batch_shim_refusal_names_target[.cmd]'
            'test_platform_procs::test_bare_git_uses_path_only[parent]'
            'test_platform_procs::test_bare_git_uses_path_only[child]'
            'test_platform_procs::test_cleanup_error_keeps_primary[timeout]'
            'test_platform_procs::test_cleanup_error_keeps_primary[overflow]'
            'test_platform_procs::test_cleanup_error_keeps_primary[interrupt]'
            'test_platform_procs::test_cleanup_error_keeps_primary[launch]'
            'test_platform_procs::test_both_readers_join_before_return'
            'test_platform_procs::test_closed_pipes_live_leader'
            'test_platform_procs::test_combined_cap_interleaved_n_and_n_plus_one'
            'test_platform_procs::test_combined_cap_n_and_n_plus_one'
            'test_platform_procs::test_create_process_error_releases_handles[cwd]'
            'test_platform_procs::test_create_process_error_releases_handles[image]'
            'test_platform_procs::test_git_text_and_byte_exact_output'
            'test_platform_procs::test_inherited_stdin_and_command_timeout_fields'
            'test_platform_procs::test_interrupt_after_create_reaps_suspended_child'
            'test_platform_procs::test_interrupt_after_thread_start_joins_worker'
            'test_platform_procs::test_invalid_cap_never_spawns'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[assign]'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[resume]'
            'test_platform_procs::test_job_owns_grandchild_only[overflow]'
            'test_platform_procs::test_job_owns_grandchild_only[success]'
            'test_platform_procs::test_job_owns_grandchild_only[timeout]'
            'test_platform_procs::test_launcher_death_closes_job'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[terminate]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[setup]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[close]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[inherited-handle]'
            'test_bounded_children::test_native_launch_has_one_owner_and_rejects_a_second'
            'test_platform_procs::test_non_git_text_requires_utf8[run_bounded]'
            'test_platform_procs::test_non_git_text_requires_utf8[run_command]'
            'test_platform_procs::test_only_child_pipe_ends_inherit_and_all_handles_close'
            'test_platform_procs::test_pid_probe_alive_then_reaped'
            'test_platform_procs::test_pipe_api_error_reaches_caller[ReadFile]'
            'test_platform_procs::test_pipe_api_error_reaches_caller[WriteFile]'
            'test_platform_procs::test_resolution_uses_child_path_and_cwd'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[reader]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[writer]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[uncancellable]'
          )
          $delta = Compare-Object $expected @($ran | ForEach-Object { ($_.classname.Split('.')[-1]) + '::' + $_.name })
          if ($delta -or $unexpected.Count) { throw "Windows process test selection changed: $($delta | Out-String)$unexpected" }

      - name: Verify LF line endings on armor-pinned fixtures
        run: |
          $files = @(
            "plugins/self-learn/cli/tests/support.py",
            "plugins/self-learn/cli/tests/conftest.py",
            "plugins/self-learn/cli/tests/backends.py"
          )
          $lines = git ls-files --eol -- @files
          if ($LASTEXITCODE -ne 0 -or $lines.Count -ne $files.Count) {
            Write-Error "Unexpected git ls-files --eol output"
            exit 1
          }
          $bad = $lines | Where-Object { $_ -notmatch '\bw/lf\b' }
          if ($bad) {
            Write-Error ("Non-LF working-tree line endings detected:`n" + ($bad -join "`n"))
            exit 1
          }
          $lines

      - name: Native CLI import, help and refusal
        working-directory: plugins/self-learn/cli
        run: |
          uv run --no-sync python -c "import self_learn.cli"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync self-learn --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $errFile = Join-Path $env:RUNNER_TEMP "capture-refusal.txt"
          $out = uv run --no-sync self-learn status 2>$errFile
          if ($LASTEXITCODE -ne 1 -or $out -or (Get-Content $errFile -Raw).TrimEnd() -cne 'self-learn status: unavailable in Windows capture mode') {
            throw "Unexpected native CLI refusal"
          }
          exit 0

  linux-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          mkdir -p "$sl_home" "$xdg_cache"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"

      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest tests/test_home_floor.py -p no:cacheprovider -q

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync pytest tests/test_home_floor.py -q

      - name: CLI test collection check
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest --collect-only -q tests/

  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # test_armor.py compares HEAD with the local `master` branch, which a
      # branch or pull-request checkout does not create.
      - name: Make sure a local master branch exists
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master

      - name: Install system tools required by CLI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git jq libnotify-bin gawk

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # 3.13: test_armor.py's pinned syntax-tree digests were measured on
          # 3.13 and differ under 3.12 (first run: 7 armor failures).
          python-version: "3.13"
          enable-cache: true

      - name: Configure scratch ledger, cache, and suite output directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          suite_out="${RUNNER_TEMP}/suite-out"
          mkdir -p "$sl_home" "$xdg_cache" "$suite_out"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"
          printf 'SUITE_OUT=%s\n' "$suite_out" >> "$GITHUB_ENV"

      - name: Run CLI test suite
        run: SUITE_WORKERS=4 plugins/self-learn/cli/scripts/suite

      - name: Upload CLI suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-suite-log
          path: ${{ runner.temp }}/suite-out/suite.log
          if-no-files-found: warn
