name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-canary:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          $slHome = Join-Path $env:RUNNER_TEMP "self-learn-home"
          $xdgCache = Join-Path $env:RUNNER_TEMP "xdg-cache"
          New-Item -ItemType Directory -Force -Path $slHome, $xdgCache | Out-Null
          "SELF_LEARN_HOME=$slHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_CACHE_HOME=$xdgCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The home-floor steps load the package-root conftest in isolation.
      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: Native capture integration
        working-directory: plugins/self-learn/cli
        run: |
          $env:WIN_PD_OVERRIDE_LOCAL_APPDATA = Join-Path $env:RUNNER_TEMP "capture-local"
          $env:WIN_PD_OVERRIDE_APPDATA = Join-Path $env:RUNNER_TEMP "capture-roaming"
          $expected = @(
            'test_cross_drive_pointer_and_git_rejection'
            'test_foreign_registry_is_readable_and_preserved'
            'test_registration_reads_registry_under_shared_lock'
            'test_flagged_spool_uses_verified_private_quarantine'
            'test_committed_receipt_survives_cache_junction[cache]'
            'test_committed_receipt_survives_cache_junction[spool]'
            'test_flush_preflights_all_targets'
            'test_plain_teach_pushes_to_local_remote[fast-forward]'
            'test_plain_teach_pushes_to_local_remote[remote-moved]'
            'test_windows_git_error_contracts'
            'test_first_capture_heals_missing_project_meta'
            'test_repair_hints_follow_capabilities_and_statement_captures'
            'test_capability_table_matches_parser'
            'test_refusal_profile_precedes_dispatch'
            'test_background_kicks_refuse_before_settings'
            'test_two_powershell_processes_share_committed_capture[default]'
            'test_two_powershell_processes_share_committed_capture[utf8]'
            'test_worktrees_and_modes_share_commit_lock'
            'test_recovery_after_killed_writer'
            'test_concurrent_flush_and_append'
            'test_git_excludes_trailing_space'
            'test_readonly_and_creating_cache_have_same_path'
            'test_component_rejects_invalid_actor_without_creating_spool'
            'test_static_junction_escape_refused'
            'test_git_tree_keys_and_literal_pathspec_with_unrelated_index_entry'
            'test_existing_buckets_roundtrip_without_rekey'
            'test_init_repairs_local_config_before_recovery'
            'test_init_bootstraps_empty_repository[git-init]'
            'test_init_bootstraps_empty_repository[empty-clone]'
            'test_init_finds_original_subject_in_clone'
            'test_init_reports_failed_config_rollback'
            'test_statement_failure_preserves_committed_receipt[symlink]'
            'test_statement_failure_preserves_committed_receipt[malformed]'
          )
          foreach ($version in '3.12', '3.13') {
            if ($version -eq '3.13') {
              $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "capture-env-313"
              uv sync --locked --python $version
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            $report = Join-Path $env:RUNNER_TEMP "capture-$version.xml"
            uv run --python $version --no-sync python -m pytest tests/test_windows_capture.py tests/test_platform_integration.py -p no:cacheprovider -o xfail_strict=true -q -rA --junitxml=$report
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
            $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") } | ForEach-Object { $_.name })
            $skipped = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
            if ((Compare-Object -CaseSensitive $expected $ran) -or $skipped.Count -ne 1 -or $skipped[0].name -cne 'test_linux_teach_never_imports_capabilities' -or $skipped[0].skipped.message -cne 'Linux capture contract') {
              throw "Unexpected capture selection or skip: $ran"
            }
          }

      - name: Windows observer hook tests
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "observer-hook-contracts.xml"
          uv run --no-sync python -m pytest tests/test_hook_entry.py -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object {
            $_.name -cmatch '^test_(windows_console_hook|hook_closed_descriptors)\[' -and !$_.SelectSingleNode("skipped")
          })
          $posix = @($cases | Where-Object {
            ($_.name -cmatch '^test_bash_differential\[' -and $_.skipped.message -ceq "Bash differential runs on POSIX") -or
              ($_.name -cmatch '^test_linux_child_deadline_survives_hook_death\[' -and $_.skipped.message -ceq "Linux parent-death watchdog")
          })
          if ($ran.Count -ne 68 -or $posix.Count -ne 76 -or $cases.Count -ne 144) {
            throw "Expected 68 native hook cases and 76 POSIX-only skips. Executed $($ran.Count) native cases. Found $($posix.Count) POSIX-only skips and $($cases.Count) total cases."
          }

      - name: Windows owner and link contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "owner-contracts.xml"
          uv run --no-sync python -m pytest tests/test_windows_ownership.py -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $unexpected = @($skips | Where-Object { $_.skipped.message -cne "POSIX owner and link contract" })
          if ($ran.Count -ne 20 -or $skips.Count -ne 3 -or $unexpected.Count) {
            throw "Expected 20 executed owner and link cases and 3 POSIX-only skips. Executed $($ran.Count), skipped $($skips.Count), unexpected $($unexpected.Count)."
          }

      - name: Windows managed link contracts on Python 3.12 and 3.13
        working-directory: plugins/self-learn/cli
        run: |
          $expected = @(
            'test_directory_publication_and_removal', 'test_dangling_directory', 'test_file_link',
            'test_occupied_directory', 'test_windows_native_facts', 'test_windows_target_validation',
            'test_windows_privilege_error', 'test_windows_retarget_failure_preserves_entries',
            'test_windows_volume_mount_is_unmanaged', 'test_windows_remove_deletes_checked_handle',
            'test_windows_dangling_directory_symlink_callers', 'test_windows_published_with_busy_stage',
            'test_windows_adoption_refuses_junction[root]', 'test_windows_adoption_refuses_junction[descendant]',
            'test_windows_skill_write_and_relink_report_refused_volume'
          )
          foreach ($version in '3.12', '3.13') {
            $report = Join-Path $env:RUNNER_TEMP "link-contracts-$version.xml"
            $python = ".venv/Scripts/python.exe"
            if ($version -eq '3.13') {
              $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "link-venv-$version"
              uv sync --locked --python $version
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              $python = Join-Path $env:UV_PROJECT_ENVIRONMENT 'Scripts/python.exe'
            }
            & $python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '$version'.split('.')))"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $python -m pytest tests/test_platform_links.py -p no:cacheprovider -o xfail_strict=true -q -rA --junitxml=$report
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cases = ([xml](Get-Content -Raw $report)).SelectNodes('//testcase')
            $ran = @($cases | Where-Object { !$_.SelectSingleNode('skipped') } | ForEach-Object { $_.name })
            $skipped = @($cases | Where-Object { $_.SelectSingleNode('skipped') })
            if (!$ran.Count -or (Compare-Object $expected $ran) -or $skipped.Count -ne 3 -or
                @($skipped | Where-Object { $_.skipped.message -cne 'POSIX skill installation calls' }).Count) {
              throw "Unexpected link contract selection on Python $version (ran $ran)"
            }
          }

      - name: Windows Git history and FTS5 contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "git-history-contracts.xml"
          uv run --no-sync python -m pytest tests/test_windows_git_history.py -p no:cacheprovider -q -rA -o xfail_strict=true --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $expected = @(
            'test_daily_history'
            'test_windows_history_counts_quoted_bucket_and_framed_blob'
            'test_selected_paths'
            'test_review_commit_bytes'
            'test_windows_literal_status_and_diff'
            'test_allow_empty_leaves_no_matching_sibling_staged'
            'test_fts5_round_trip'
            'test_push_local_bare'
            'test_windows_unreachable_push_env'
            'test_bucket_history[ascii-queue]'
            'test_bucket_history[ascii-steward]'
            'test_bucket_history[ascii-overseer]'
            'test_bucket_history[unicode-queue]'
            'test_bucket_history[unicode-steward]'
            'test_bucket_history[unicode-overseer]'
            'test_missing_history_blob'
            'test_undecodable_git_names'
            'test_windows_hook_removal'
            'test_windows_notice_file'
            'test_windows_ask_history'
            'test_windows_ssh_override[default]'
            'test_windows_ssh_override[env]'
            'test_windows_ssh_override[config]'
          )
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") } | ForEach-Object { $_.name })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $posix = @(
            'test_bucket_history[quote-queue]'
            'test_bucket_history[quote-steward]'
            'test_bucket_history[quote-overseer]'
            'test_bucket_history[newline-queue]'
            'test_bucket_history[newline-steward]'
            'test_bucket_history[newline-overseer]'
          )
          if ($ran.Count -ne $expected.Count -or (Compare-Object $expected $ran) -or
              $skips.Count -ne $posix.Count -or (Compare-Object $posix @($skips | ForEach-Object { $_.name })) -or
              @($skips | Where-Object { $_.skipped.message -cne "POSIX filename" }).Count) {
            throw "Windows Git test selection changed: $ran"
          }

      - name: Windows names and folders contracts
        working-directory: plugins/self-learn/cli
        run: |
          $env:WIN_PD_OVERRIDE_LOCAL_APPDATA = Join-Path $env:RUNNER_TEMP "names-local"
          $env:WIN_PD_OVERRIDE_APPDATA = Join-Path $env:RUNNER_TEMP "names-roaming"
          $report = Join-Path $env:RUNNER_TEMP "names-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_names.py -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { $_.name -like "test_windows_*" -and !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "historical POSIX storage contract"
          })
          if ($ran.Count -ne 17 -or $unexpected.Count) { throw "Unexpected native names test count or skip" }

      - name: Windows file-lock contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "lock-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_locks.py -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { $_.name -like "test_windows_*" -and !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "POSIX lock semantics or product integration"
          })
          if (!$ran.Count) { throw "No native Windows lock test ran" }
          if ($unexpected.Count) { throw "Unexpectedly skipped lock tests: $($unexpected.name -join ', ')" }

      - name: Windows file publishing contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "fsops-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_fsops.py -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $unexpected = @($skips | Where-Object { $_.skipped.message -cne "Linux filesystem contract" })
          if ($ran.Count -ne 28 -or $skips.Count -ne 7 -or $unexpected.Count -ne 0) {
            throw "Expected 28 executed fsops cases and 7 Linux-only skips. Executed $($ran.Count), skipped $($skips.Count), unexpected $($unexpected.Count)."
          }

      - name: Windows process contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "process-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_procs.py tests/test_bounded_children.py::test_native_launch_has_one_owner_and_rejects_a_second -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "Linux process contract"
          })
          $expected = @(
            'test_platform_procs::test_argument_stdin_encoding_exit_matrix'
            'test_platform_procs::test_batch_shim_refusal_names_target[.bat]'
            'test_platform_procs::test_batch_shim_refusal_names_target[.cmd]'
            'test_platform_procs::test_bare_git_uses_path_only[parent]'
            'test_platform_procs::test_bare_git_uses_path_only[child]'
            'test_platform_procs::test_cleanup_error_keeps_primary[timeout]'
            'test_platform_procs::test_cleanup_error_keeps_primary[overflow]'
            'test_platform_procs::test_cleanup_error_keeps_primary[interrupt]'
            'test_platform_procs::test_cleanup_error_keeps_primary[launch]'
            'test_platform_procs::test_both_readers_join_before_return'
            'test_platform_procs::test_closed_pipes_live_leader'
            'test_platform_procs::test_combined_cap_interleaved_n_and_n_plus_one'
            'test_platform_procs::test_combined_cap_n_and_n_plus_one'
            'test_platform_procs::test_create_process_error_releases_handles[cwd]'
            'test_platform_procs::test_create_process_error_releases_handles[image]'
            'test_platform_procs::test_git_text_and_byte_exact_output'
            'test_platform_procs::test_inherited_stdin_and_command_timeout_fields'
            'test_platform_procs::test_interrupt_after_create_reaps_suspended_child'
            'test_platform_procs::test_interrupt_after_thread_start_joins_worker'
            'test_platform_procs::test_invalid_cap_never_spawns'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[assign]'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[resume]'
            'test_platform_procs::test_job_owns_grandchild_only[overflow]'
            'test_platform_procs::test_job_owns_grandchild_only[success]'
            'test_platform_procs::test_job_owns_grandchild_only[timeout]'
            'test_platform_procs::test_launcher_death_closes_job'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[terminate]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[setup]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[close]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[inherited-handle]'
            'test_bounded_children::test_native_launch_has_one_owner_and_rejects_a_second'
            'test_platform_procs::test_non_git_text_requires_utf8[run_bounded]'
            'test_platform_procs::test_non_git_text_requires_utf8[run_command]'
            'test_platform_procs::test_only_child_pipe_ends_inherit_and_all_handles_close'
            'test_platform_procs::test_pid_probe_alive_then_reaped'
            'test_platform_procs::test_pipe_api_error_reaches_caller[ReadFile]'
            'test_platform_procs::test_pipe_api_error_reaches_caller[WriteFile]'
            'test_platform_procs::test_resolution_uses_child_path_and_cwd'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[reader]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[writer]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[uncancellable]'
          )
          $delta = Compare-Object $expected @($ran | ForEach-Object { ($_.classname.Split('.')[-1]) + '::' + $_.name })
          if ($delta -or $unexpected.Count) { throw "Windows process test selection changed: $($delta | Out-String)$unexpected" }

      - name: Windows child containment contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "containment-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_procs_contain.py -p no:cacheprovider -q -rsP --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $unexpected = @($skips | Where-Object { $_.skipped.message -cne "Linux process contract" })
          $expected = @(
            'test_windows_grandchild_outlives_child_without_containment'
            'test_windows_contain_then_terminate_kills_child_and_grandchild'
            'test_windows_dropping_the_handle_kills_the_child'
            'test_windows_early_grandchild_race_is_closed_by_adoption'
            'test_windows_early_grandchild_race_measured'
            'test_windows_orphaned_great_grandchild_is_the_uncovered_gap'
            'test_windows_stale_snapshot_row_never_puts_an_unrelated_process_in_the_job'
            'test_windows_adoption_requires_a_strictly_younger_child[older]'
            'test_windows_adoption_requires_a_strictly_younger_child[tie]'
            'test_windows_breakaway_after_assignment_is_never_recaptured'
            'test_windows_child_spawned_during_assignment_is_adopted'
            'test_windows_sweep_failures_are_reported_not_raised[snapshot]'
            'test_windows_sweep_failures_are_reported_not_raised[refusal]'
            'test_windows_sweep_failures_are_reported_not_raised[passes]'
            'test_windows_sweep_failures_are_reported_not_raised[close-after-failed-walk]'
            'test_windows_sweep_failures_are_reported_not_raised[close-only]'
            'test_windows_sweep_failures_are_reported_not_raised[parent-query]'
            'test_windows_interrupted_containment_hands_the_job_over'
            'test_windows_interrupted_containment_publishes_its_owner[translated]'
            'test_windows_interrupted_containment_publishes_its_owner[after-adoption]'
            'test_windows_abrupt_death_of_the_container[none]'
            'test_windows_abrupt_death_of_the_container[child]'
            'test_windows_abrupt_death_of_the_container[self]'
            'test_windows_contained_self_keeps_its_exit_status[exit]'
            'test_windows_contained_self_keeps_its_exit_status[finalize]'
            'test_windows_self_assignment_interrupted_keeps_the_job'
            'test_windows_breakaway_from_the_self_job_before_containment_is_left_out'
            'test_windows_identity_tells_a_reused_pid_apart'
            'test_windows_filetime_conversion_keeps_both_words'
            'test_windows_identity_keeps_the_full_creation_time'
            'test_windows_identity_predates_boot'
            'test_windows_identity_and_contain_of_missing_or_exited_pid'
            'test_windows_identity_open_errors[ERROR_ACCESS_DENIED-None]'
            'test_windows_identity_open_errors[ERROR_INVALID_HANDLE-OSError]'
            'test_windows_identity_errors_carry_winerror_and_cause[_get_process_times-ERROR_INVALID_HANDLE]'
            'test_windows_identity_errors_carry_winerror_and_cause[_query_image-ERROR_INSUFFICIENT_BUFFER]'
            'test_windows_contain_child_already_in_a_job'
            'test_windows_refused_assignment_surfaces_winerror_and_kills_nothing'
            'test_windows_refused_self_assignment_releases_the_job'
            'test_windows_terminate_is_bounded[count]'
            'test_windows_terminate_is_bounded[handle]'
            'test_windows_terminate_cleanup_error_surfaces'
            'test_windows_job_flags_allow_breakaway_and_kill_on_close'
            'test_identities_compare_and_hash_by_value'
          )
          $delta = Compare-Object $expected @($ran | ForEach-Object { $_.name })
          if ($delta -or $unexpected.Count -or $skips.Count -ne 20) {
            throw "Windows containment test selection changed: ran $($ran.Count), skipped $($skips.Count), unexpected $($unexpected.Count) $($delta | Out-String)"
          }

      - name: Windows SDK child lifecycle contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "sdk-lifecycle-contracts.xml"
          uv run --no-sync python -m pytest tests/test_windows_sdk_lifecycle.py -p no:cacheprovider -q -rsP --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $skips = @($cases | Where-Object { $_.SelectSingleNode("skipped") })
          $unexpected = @($skips | Where-Object { $_.skipped.message -cne "Linux SDK lifecycle contract" })
          $expected = @(
            'test_windows_backend_registers_the_procs_calls_on_import'
            'test_windows_sidecar_round_trips_the_contained_identity'
            'test_windows_last_rung_ends_the_grandchild_after_the_sdk_ended_the_child'
            'test_windows_session_contains_the_child_and_teardown_kills_both'
            'test_windows_containment_trouble_never_fails_the_session[contain-raises]'
            'test_windows_containment_trouble_never_fails_the_session[contain-interrupted]'
            'test_windows_containment_trouble_never_fails_the_session[terminate-times-out]'
            'test_windows_containment_trouble_never_fails_the_session[self-refused]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[leftover]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[sdk-chose]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[reused-pid]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[predates-boot]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[not-claude]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[not-claude-no-cli]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[claude-elsewhere]'
            'test_windows_orphan_sweep_kills_only_a_true_leftover[no-identity]'
            'test_windows_orphan_sweep_declines_a_sidecar_that_is_not_stale'
            'test_windows_abrupt_death_of_self_learn_leaves_no_survivor[contained]'
            'test_windows_abrupt_death_of_self_learn_leaves_no_survivor[self-only]'
            'test_windows_abrupt_death_of_self_learn_leaves_no_survivor[child-only]'
            'test_windows_abrupt_death_of_self_learn_leaves_no_survivor[uncontained]'
            'test_windows_cli_search_refuses_a_cmd_shim_and_finds_the_exe'
            'test_windows_cli_search_never_looks_in_the_current_folder'
            'test_windows_cli_search_refuses_a_path_through_a_batch_named_folder'
            'test_windows_doctor_names_the_program_or_why_there_is_none'
            'test_windows_bundled_claude_exe_answers_version'
            'test_windows_sessions_run_on_the_proactor_event_loop'
            'test_batch_rule_matches_the_sdks_own'
          )
          $delta = Compare-Object $expected @($ran | ForEach-Object { $_.name })
          if ($delta -or $unexpected.Count -or $skips.Count -ne 1) {
            throw "Windows SDK lifecycle test selection changed: ran $($ran.Count), skipped $($skips.Count), unexpected $($unexpected.Count) $($delta | Out-String)"
          }

      - name: Verify LF line endings on armor-pinned fixtures
        run: |
          $files = @(
            "plugins/self-learn/cli/tests/support.py",
            "plugins/self-learn/cli/tests/conftest.py",
            "plugins/self-learn/cli/tests/backends.py"
          )
          $lines = git ls-files --eol -- @files
          if ($LASTEXITCODE -ne 0 -or $lines.Count -ne $files.Count) {
            Write-Error "Unexpected git ls-files --eol output"
            exit 1
          }
          $bad = $lines | Where-Object { $_ -notmatch '\bw/lf\b' }
          if ($bad) {
            Write-Error ("Non-LF working-tree line endings detected:`n" + ($bad -join "`n"))
            exit 1
          }
          $lines

      - name: Native CLI import, help and refusal
        working-directory: plugins/self-learn/cli
        run: |
          uv run --no-sync python -c "import self_learn.cli"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync self-learn --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $errFile = Join-Path $env:RUNNER_TEMP "capture-refusal.txt"
          $out = uv run --no-sync self-learn status 2>$errFile
          if ($LASTEXITCODE -ne 1 -or $out -or (Get-Content $errFile -Raw).TrimEnd() -cne 'self-learn status: unavailable in Windows capture mode') {
            throw "Unexpected native CLI refusal"
          }
          exit 0

  linux-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          mkdir -p "$sl_home" "$xdg_cache"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"

      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest tests/test_home_floor.py -p no:cacheprovider -q

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync pytest tests/test_home_floor.py -q

      - name: CLI test collection check
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest --collect-only -q tests/

  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # test_armor.py compares HEAD with the local `master` branch, which a
      # branch or pull-request checkout does not create.
      - name: Make sure a local master branch exists
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master

      - name: Install system tools required by CLI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git jq libnotify-bin gawk

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # 3.13: test_armor.py's pinned syntax-tree digests were measured on
          # 3.13 and differ under 3.12 (first run: 7 armor failures).
          python-version: "3.13"
          enable-cache: true

      - name: Configure scratch ledger, cache, and suite output directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          suite_out="${RUNNER_TEMP}/suite-out"
          mkdir -p "$sl_home" "$xdg_cache" "$suite_out"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"
          printf 'SUITE_OUT=%s\n' "$suite_out" >> "$GITHUB_ENV"

      - name: Run CLI test suite
        run: SUITE_WORKERS=4 plugins/self-learn/cli/scripts/suite

      - name: Upload CLI suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-suite-log
          path: ${{ runner.temp }}/suite-out/suite.log
          if-no-files-found: warn
