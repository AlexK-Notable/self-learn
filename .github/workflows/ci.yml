name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-canary:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          $slHome = Join-Path $env:RUNNER_TEMP "self-learn-home"
          $xdgCache = Join-Path $env:RUNNER_TEMP "xdg-cache"
          New-Item -ItemType Directory -Force -Path $slHome, $xdgCache | Out-Null
          "SELF_LEARN_HOME=$slHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_CACHE_HOME=$xdgCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The nested tests/conftest.py files still import a POSIX-only product
      # module, so on Windows the package-root conftest (which installs the
      # home floor) is loaded as a plugin and nested conftests are skipped.
      # Drop --noconftest -p conftest once the CLI imports on Windows.
      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync python -m pytest --noconftest -p conftest tests/test_home_floor.py -p no:cacheprovider -q -rs

      - name: Windows process contracts
        working-directory: plugins/self-learn/cli
        run: |
          $report = Join-Path $env:RUNNER_TEMP "process-contracts.xml"
          uv run --no-sync python -m pytest tests/test_platform_procs.py tests/test_bounded_children.py::test_native_launch_has_one_owner_and_rejects_a_second --deselect=tests/test_bounded_children.py::test_native_launch_has_one_owner_and_rejects_a_second -o xfail_strict=true -p no:cacheprovider -q -rA --junitxml=$report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = ([xml](Get-Content -Raw $report)).SelectNodes("//testcase")
          $ran = @($cases | Where-Object { !$_.SelectSingleNode("skipped") })
          $unexpected = @($cases | Where-Object {
            $_.SelectSingleNode("skipped") -and $_.skipped.message -ne "Linux process contract"
          })
          $expected = @(
            'test_platform_procs::test_argument_stdin_encoding_exit_matrix'
            'test_platform_procs::test_batch_shim_refusal_names_target[.bat]'
            'test_platform_procs::test_batch_shim_refusal_names_target[.cmd]'
            'test_platform_procs::test_both_readers_join_before_return'
            'test_platform_procs::test_closed_pipes_live_leader'
            'test_platform_procs::test_combined_cap_interleaved_n_and_n_plus_one'
            'test_platform_procs::test_combined_cap_n_and_n_plus_one'
            'test_platform_procs::test_create_process_error_releases_handles[cwd]'
            'test_platform_procs::test_create_process_error_releases_handles[image]'
            'test_platform_procs::test_git_text_and_byte_exact_output'
            'test_platform_procs::test_inherited_stdin_and_command_timeout_fields'
            'test_platform_procs::test_interrupt_after_create_reaps_suspended_child'
            'test_platform_procs::test_interrupt_after_thread_start_joins_worker'
            'test_platform_procs::test_invalid_cap_never_spawns'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[assign]'
            'test_platform_procs::test_job_launch_failure_never_runs_payload[resume]'
            'test_platform_procs::test_job_owns_grandchild_only[overflow]'
            'test_platform_procs::test_job_owns_grandchild_only[success]'
            'test_platform_procs::test_job_owns_grandchild_only[timeout]'
            'test_platform_procs::test_launcher_death_closes_job'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[terminate]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[setup]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[close]'
            'test_platform_procs::test_native_errors_include_cause_during_setup_and_cleanup[inherited-handle]'
            'test_bounded_children::test_native_launch_has_one_owner_and_rejects_a_second'
            'test_platform_procs::test_non_git_text_requires_utf8[run_bounded]'
            'test_platform_procs::test_non_git_text_requires_utf8[run_command]'
            'test_platform_procs::test_only_child_pipe_ends_inherit_and_all_handles_close'
            'test_platform_procs::test_pid_probe_alive_then_reaped'
            'test_platform_procs::test_pipe_api_error_reaches_caller[ReadFile]'
            'test_platform_procs::test_pipe_api_error_reaches_caller[WriteFile]'
            'test_platform_procs::test_resolution_uses_child_path_and_cwd'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[reader]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[writer]'
            'test_platform_procs::test_stuck_pipe_has_bounded_cleanup[uncancellable]'
          )
          $delta = Compare-Object $expected @($ran | ForEach-Object { ($_.classname.Split('.')[-1]) + '::' + $_.name })
          if ($delta -or $unexpected.Count) { throw "Windows process test selection changed: $($delta | Out-String)$unexpected" }

      - name: Verify LF line endings on armor-pinned fixtures
        run: |
          $files = @(
            "plugins/self-learn/cli/tests/support.py",
            "plugins/self-learn/cli/tests/conftest.py",
            "plugins/self-learn/cli/tests/backends.py"
          )
          $lines = git ls-files --eol -- @files
          if ($LASTEXITCODE -ne 0 -or $lines.Count -ne $files.Count) {
            Write-Error "Unexpected git ls-files --eol output"
            exit 1
          }
          $bad = $lines | Where-Object { $_ -notmatch '\bw/lf\b' }
          if ($bad) {
            Write-Error ("Non-LF working-tree line endings detected:`n" + ($bad -join "`n"))
            exit 1
          }
          $lines

      - name: CLI import probe (expected to fail until Windows port lands)
        working-directory: plugins/self-learn/cli
        continue-on-error: true
        run: |
          uv run --no-sync python -c "import self_learn.cli"
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            "### Windows CLI import probe`n`n- **Status:** ``self_learn.cli`` imports cleanly on Windows." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "### Windows CLI import probe`n`n- **Status:** ``self_learn.cli`` does **not** import on Windows yet (expected until Unix-only imports such as ``fcntl`` are ported; exit code $rc)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          exit $rc

  linux-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync CLI and UI environments
        run: |
          uv sync --locked --project plugins/self-learn/cli
          uv sync --locked --project plugins/self-learn/ui

      - name: Configure scratch ledger and cache directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          mkdir -p "$sl_home" "$xdg_cache"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"

      - name: CLI home-floor tests
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest tests/test_home_floor.py -p no:cacheprovider -q

      - name: UI home-floor tests
        working-directory: plugins/self-learn/ui
        run: uv run --no-sync pytest tests/test_home_floor.py -q

      - name: CLI test collection check
        working-directory: plugins/self-learn/cli
        run: uv run --no-sync pytest --collect-only -q tests/

  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # test_armor.py compares HEAD with the local `master` branch, which a
      # branch or pull-request checkout does not create.
      - name: Make sure a local master branch exists
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master

      - name: Install system tools required by CLI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git jq libnotify-bin gawk

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # 3.13: test_armor.py's pinned syntax-tree digests were measured on
          # 3.13 and differ under 3.12 (first run: 7 armor failures).
          python-version: "3.13"
          enable-cache: true

      - name: Configure scratch ledger, cache, and suite output directories
        run: |
          sl_home="${RUNNER_TEMP}/self-learn-home"
          xdg_cache="${RUNNER_TEMP}/xdg-cache"
          suite_out="${RUNNER_TEMP}/suite-out"
          mkdir -p "$sl_home" "$xdg_cache" "$suite_out"
          printf 'SELF_LEARN_HOME=%s\n' "$sl_home" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache" >> "$GITHUB_ENV"
          printf 'SUITE_OUT=%s\n' "$suite_out" >> "$GITHUB_ENV"

      - name: Run CLI test suite
        run: SUITE_WORKERS=4 plugins/self-learn/cli/scripts/suite

      - name: Upload CLI suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-suite-log
          path: ${{ runner.temp }}/suite-out/suite.log
          if-no-files-found: warn
