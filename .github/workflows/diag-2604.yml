name: Diagnose Ubuntu process tests
on:
  push:
    branches: [ci-2604]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: plugins/self-learn/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: "3.13"
      - run: |
          uv sync --locked
          cat /etc/os-release
          readlink -f "$(command -v sleep)"
          mkdir -p "$RUNNER_TEMP"/{h,c}
          echo "SELF_LEARN_HOME=$RUNNER_TEMP/h" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/c" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.github" >> "$GITHUB_ENV"
      - name: Original assertion in isolation
        env:
          TRACE_FILE: ${{ runner.temp }}/single.trace
        run: uv run --no-sync pytest -p diag_2604 -p no:cacheprovider -q tests/test_invocation_sdk.py -k kl4_hang
      - if: always()
        run: cat "$RUNNER_TEMP/single.trace"
      - name: File under four workers
        if: always()
        env:
          TRACE_FILE: ${{ runner.temp }}/parallel.trace
        run: uv run --no-sync pytest -p diag_2604 -p no:cacheprovider -q -n 4 tests/test_invocation_sdk.py
      - if: always()
        run: cat "$RUNNER_TEMP/parallel.trace"
      - name: Hook timing samples
        if: always()
        run: uv run --no-sync pytest -p no:cacheprovider -q -n 4 --durations=0 tests/test_hook_command_view.py -k 'linear_at_the_size_cap or a_hook_run_at_the_cap_is_bounded'
