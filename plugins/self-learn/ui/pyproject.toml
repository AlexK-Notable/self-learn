[project]
name = "self-learn-ui"
version = "0.1.0"
description = "self-learn adjudication surface — localhost web UI (G-3)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alex K", email = "alexkechichian1@gmail.com" },
]
keywords = ["claude", "claude-code", "self-learning", "adjudication-ui"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pygments>=2.18",
    "markdown-it-py>=3.0",
    "watchfiles>=0.24",
    "PyYAML>=6.0",
    "claude-agent-sdk>=0.2.116,<0.3",
    "self-learn-cli",
]

[project.scripts]
self-learn-ui = "self_learn_ui.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_learn_ui"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # FW-17 JS DOM harness (tests/test_js_dom.py): a real browser is the
    # only engine that runs app.js + htmx + EventSource. Playwright's
    # python package is a pip/uv dependency (its driver is bundled — this
    # adds NO npm/node toolchain the developer manages); the matched
    # Chromium build is fetched once via `uv run playwright install
    # chromium`. The suite is marked `js` and auto-skips when the browser
    # is absent, so the default `pytest` run never depends on it.
    "playwright>=1.47",
]

[tool.uv.sources]
# Path dependency on the sibling CLI project (10 §1 transient-state row):
# the ui package IMPORTS the CLI's cache_dir() derivation rather than
# reimplementing or shelling it out. Editable so `uv run` in ui/ always
# sees the live cli/ source tree during development.
self-learn-cli = { path = "../cli", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "js: browser-driven DOM tests for static/app.js (FW-17). Slower than the unit suite; select with `-m js`, exclude with `-m 'not js'`. Auto-skipped when Playwright's Chromium is not installed.",
]
