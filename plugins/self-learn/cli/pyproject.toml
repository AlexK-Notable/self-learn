[project]
name = "self-learn-cli"
version = "0.1.0"
description = "self-learn ledger CLI — capture, triage, and route session lessons (M1)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alex K", email = "alexkechichian1@gmail.com" },
]
keywords = ["claude", "claude-code", "self-learning", "ledger"]
dependencies = []

[project.scripts]
self-learn = "self_learn.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_learn"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
