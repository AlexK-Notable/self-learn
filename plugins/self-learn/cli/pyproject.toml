[project]
name = "self-learn-cli"
version = "0.1.0"
description = "self-learn ledger CLI — capture, triage, and route session lessons (M1)."
requires-python = ">=3.11"
license = "FSL-1.1-MIT"
authors = [
    { name = "Alex K", email = "alexkechichian1@gmail.com" },
]
keywords = ["claude", "claude-code", "self-learning", "ledger"]
dependencies = [
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.2.116,<0.3"]

[project.scripts]
self-learn = "self_learn.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_learn"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "claude-agent-sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
