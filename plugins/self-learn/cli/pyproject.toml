[project]
name = "self-learn-cli"
version = "0.1.0"
description = "self-learn ledger CLI — capture, triage, and route session lessons (M1)."
requires-python = ">=3.11"
license = "FSL-1.1-MIT"
authors = [
    { name = "Alex K", email = "alexkechichian1@gmail.com" },
]
keywords = ["claude", "claude-code", "self-learning", "ledger"]
dependencies = [
    "ruamel.yaml>=0.18",
    "claude-agent-sdk>=0.2.116,<0.3",
    "portalocker>=4.4.2 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "platformdirs>=4.3 ; sys_platform == 'win32'",
]

# U-cleanup S-49: the "cli" backend is retired and claude-agent-sdk moved
# to a hard dependency above. The [sdk] extra is kept as an EMPTY alias
# (ruled, Q-3) so `pip install 'self-learn-cli[sdk]'` -- printed at
# operators by three shipped tests and the runbook -- keeps resolving
# rather than becoming an error.
[project.optional-dependencies]
sdk = []

[project.scripts]
self-learn = "self_learn.cli:entrypoint"
self-learn-hook = "self_learn.hook_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_learn"]

# Package data (Windows port, 8K): the skill's references (doctrine, rubric,
# methods, the card-sections registry, the lesson-writing passage) ride inside
# the wheel under self_learn/_data/references, included from where they live.
# hatch_build.py adds them to the wheel from the checkout, or, for a wheel
# built from an sdist, finds them where the sdist staged them; it adds nothing
# to an editable install, which reads the checkout itself.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.force-include]
"../skills/self-learn/references" = "src/self_learn/_data/references"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "claude-agent-sdk",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# tmp_path directories: /tmp is a RAM-backed tmpfs on many Linux desktops.
# By default pytest keeps every directory of the last 3 runs, which left
# ~2.4 GB per xdist suite run in RAM. Passing tests' directories now go when
# they finish, and only the latest run's leftovers are kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
